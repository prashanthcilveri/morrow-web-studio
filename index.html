<html lang="en">

    <meta name="keywords"

        content="Morrow Web Studio | Websites That Make Businesses Stand Out">

    <meta property="og:description"
        content="Modern, responsive websites designed for local businesses and growing brands.">

    <meta property="og:type" content="website">

    <meta property="og:locale" content="en_IN">

    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0a">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #080808;
            color: #f5f5f5;
            font-family: "DM Sans", sans-serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        ::selection {
            background: #ff5a1f;
            color: white;
        }


        /* =========================================
           VARIABLES
        ========================================= */

        :root {
            --orange: #ff5a1f;
            --orange-light: #ff7a3d;
            --black: #080808;
            --dark: #111111;
            --dark2: #171717;
            --gray: #999;
            --white: #f5f5f5;
            --border: rgba(255,255,255,0.10);
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            padding: 22px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(8,8,8,0.72);
            backdrop-filter: blur(16px);

            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .logo-mark {
            width: 34px;
            height: 34px;

            border-radius: 10px;

            display: grid;
            place-items: center;

            background: var(--orange);

            color: white;
            font-weight: 800;

            box-shadow: 0 0 30px rgba(255,90,31,0.25);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 34px;
        }

        .nav-links a {
            color: #bbb;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-button {
            background: white;
            color: black !important;

            padding: 11px 18px;

            border-radius: 100px;

            font-weight: 700;
        }

        .nav-button:hover {
            background: var(--orange);
            color: white !important;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero {
            min-height: 100vh;

            padding: 150px 6% 80px;

            position: relative;

            display: flex;
            align-items: center;

            overflow: hidden;
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 600px;
            height: 600px;

            background: rgba(255,90,31,0.14);

            filter: blur(130px);

            border-radius: 50%;

            top: 100px;
            right: -150px;

            pointer-events: none;
        }

        .hero-content {
            width: 100%;
            max-width: 1250px;

            margin: auto;

            position: relative;
            z-index: 2;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            color: #bbb;

            font-size: 14px;

            margin-bottom: 25px;

            animation: fadeUp 0.8s ease both;
        }

        .eyebrow span {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--orange);

            box-shadow: 0 0 18px var(--orange);
        }

        h1 {
            font-family: "Space Grotesk", sans-serif;

            font-size: clamp(55px, 8vw, 115px);

            line-height: 0.92;

            letter-spacing: -6px;

            max-width: 1000px;

            animation: fadeUp 0.9s ease 0.1s both;
        }

        h1 .orange {
            color: var(--orange);
        }

        .hero-description {
            max-width: 620px;

            margin-top: 35px;

            color: #aaa;

            font-size: 18px;

            line-height: 1.7;

            animation: fadeUp 0.9s ease 0.2s both;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;

            margin-top: 35px;

            animation: fadeUp 0.9s ease 0.3s both;
        }

        .btn {
            padding: 15px 24px;

            border-radius: 100px;

            font-weight: 700;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            transition: 0.3s;

            border: 1px solid var(--border);
        }

        .btn-primary {
            background: var(--orange);
            border-color: var(--orange);

            box-shadow: 0 15px 40px rgba(255,90,31,0.18);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(255,90,31,0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.04);
        }

        .btn-secondary:hover {
            background: white;
            color: black;
        }


        /* =========================================
           MOVING STRIP
        ========================================= */

        .ticker {
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);

            overflow: hidden;

            background: #0d0d0d;
        }

        .ticker-track {
            display: flex;

            width: max-content;

            animation: ticker 25s linear infinite;

            padding: 20px 0;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 22px;

            margin-right: 45px;

            color: #ddd;

            font-family: "Space Grotesk", sans-serif;

            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .ticker-dot {
            color: var(--orange);
            font-size: 20px;
        }


        /* =========================================
           GENERAL SECTION
        ========================================= */

        section {
            padding: 120px 6%;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        .section-label {
            color: var(--orange);

            text-transform: uppercase;

            letter-spacing: 2px;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 18px;
        }

        .section-title {
            font-family: "Space Grotesk", sans-serif;

            font-size: clamp(40px, 5vw, 72px);

            line-height: 1;

            letter-spacing: -3px;
        }


        /* =========================================
           ABOUT
        ========================================= */

        .about-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 80px;

            align-items: center;
        }

        .about-text {
            color: #aaa;

            font-size: 18px;

            line-height: 1.8;
        }

        .about-text strong {
            color: white;
        }

        .about-card {
            background:
                radial-gradient(circle at 70% 20%, rgba(255,90,31,0.2), transparent 35%),
                #111;

            border: 1px solid var(--border);

            border-radius: 30px;

            padding: 45px;

            min-height: 380px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            transition: 0.5s;
        }

        .about-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,90,31,0.35);
        }

        .about-card-mark {
            font-size: 70px;

            font-family: "Space Grotesk", sans-serif;

            font-weight: 700;

            color: var(--orange);
        }

        .about-card h3 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 30px;

            margin-bottom: 12px;
        }

        .about-card p {
            color: #888;
            line-height: 1.7;
        }


        /* =========================================
           SERVICES
        ========================================= */

        .services {
            background: #0d0d0d;
        }

        .services-intro {
            max-width: 650px;

            margin-top: 25px;

            color: #888;

            line-height: 1.7;
        }

        .services-grid {
            margin-top: 60px;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 15px;
        }

        .service {
            background: #131313;

            border: 1px solid var(--border);

            border-radius: 22px;

            padding: 30px;

            min-height: 220px;

            transition: 0.4s;

            position: relative;
            overflow: hidden;
        }

        .service::after {
            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            background: var(--orange);

            opacity: 0;

            filter: blur(70px);

            right: -50px;
            bottom: -50px;

            transition: 0.4s;
        }

        .service:hover {
            transform: translateY(-8px);

            border-color: rgba(255,90,31,0.35);
        }

        .service:hover::after {
            opacity: 0.3;
        }

        .service-number {
            color: var(--orange);

            font-size: 13px;

            margin-bottom: 50px;
        }

        .service h3 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 21px;

            margin-bottom: 10px;
        }

        .service p {
            color: #777;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================================
           PROCESS
        ========================================= */

        .process-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            margin-top: 60px;
        }

        .process {
            border-top: 1px solid var(--border);

            padding-top: 25px;
        }

        .process span {
            color: var(--orange);

            font-family: "Space Grotesk", sans-serif;

            font-size: 14px;
        }

        .process h3 {
            margin-top: 45px;

            font-family: "Space Grotesk", sans-serif;

            font-size: 26px;
        }

        .process p {
            color: #777;

            line-height: 1.7;

            margin-top: 12px;
        }


        /* =========================================
           PROJECTS
        ========================================= */

        .projects {
            background: #0d0d0d;
        }

        .projects-header {
            display: flex;

            justify-content: space-between;

            align-items: end;

            gap: 30px;
        }

        .projects-description {
            max-width: 450px;

            color: #777;

            line-height: 1.7;
        }

        .projects-grid {
            margin-top: 60px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .project {
            background: #151515;

            border: 1px solid var(--border);

            border-radius: 25px;

            overflow: hidden;

            transition: 0.4s;
        }

        .project:hover {
            transform: translateY(-10px);

            border-color: rgba(255,90,31,0.35);
        }

        .project-image {
            height: 280px;

            position: relative;

            display: flex;
            align-items: end;

            padding: 25px;

            overflow: hidden;
        }

        .project-image.one {
            background:
                linear-gradient(135deg, rgba(255,90,31,0.9), rgba(30,10,5,0.9)),
                url("https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1200&q=80")
                center/cover;
        }

        .project-image.two {
            background:
                linear-gradient(135deg, rgba(5,25,70,0.85), rgba(0,0,0,0.9)),
                url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=
